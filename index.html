<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0e0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>StockPro - นับสต๊อก</title>
<style>
:root{--bg:#0e0e0f;--bg2:#161618;--card:#1c1c1f;--line:#2b2b30;--or:#ff7a00;--or2:#ffa040;--ord:#c25a00;--tx:#f6f6f6;--mu:#9b9ba3;--red:#ff5252;--grn:#37d67a;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai","Segoe UI",Tahoma,sans-serif;font-size:16px}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--tx);background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--or)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
svg.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* layout */
#app{display:flex;min-height:100vh;min-height:100dvh}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:linear-gradient(180deg,#000,var(--bg));border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--or),var(--or2));display:grid;place-items:center;color:#000;font-size:22px;box-shadow:0 4px 16px #ff7a0055}
.brand{font-weight:800;font-size:20px;letter-spacing:.3px;line-height:1.1}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--mu)}
.sp{flex:1}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
main{flex:1;min-width:0}
#view{padding:16px;padding-bottom:110px;max-width:1000px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#000d;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:12px;color:var(--mu);font-weight:600}
nav button .ic{font-size:25px}
nav button.on{color:var(--or)}
nav button.on .ic{filter:drop-shadow(0 0 8px #ff7a0099)}
@media(min-width:900px){
  nav{position:sticky;top:0;flex-direction:column;width:230px;height:100vh;padding:18px 12px;gap:6px;border-top:0;border-right:1px solid var(--line);background:#000;flex:none;backdrop-filter:none}
  nav button{flex:none;flex-direction:row;gap:12px;padding:14px 16px;border-radius:14px;font-size:16px}
  nav button.on{background:linear-gradient(90deg,#ff7a0033,transparent);box-shadow:inset 3px 0 var(--or)}
  #view{padding:24px 28px}
  .navlogo{display:flex!important}
  header.top .logo,header.top .brand{display:none}
  #app{flex-direction:row}
}
.navlogo{display:none;align-items:center;gap:10px;padding:6px 8px 18px}

/* generic */
h2{margin:6px 0 14px;font-size:22px;display:flex;align-items:center;gap:8px}
h2 .ic{color:var(--or)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;background:linear-gradient(135deg,var(--or),var(--or2));color:#1a0d00;box-shadow:0 6px 18px #ff7a0040;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.dark{background:#000;color:var(--or);border:1.5px solid var(--or);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ff5252,#ff7a52);color:#fff}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--mu)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#ff7a0022;color:var(--or2)}
.badge.red{background:#ff525226;color:var(--red)}
.badge.grn{background:#37d67a22;color:var(--grn)}
.badge.gry{background:#ffffff14;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:40px 16px}
.empty .ic{font-size:54px;color:var(--ord);margin-bottom:8px}
.searchbar{display:flex;gap:8px;position:relative;margin-bottom:12px}
.searchbar>.ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:19px}
.searchbar input{padding-left:42px}

/* product grid */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.prod{display:flex;gap:12px;align-items:center;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;position:relative;overflow:hidden}
.prod:active{border-color:var(--or)}
.prod.low{border-color:#ff525255}
.thumb{width:64px;height:64px;border-radius:14px;background:#000 center/cover no-repeat;display:grid;place-items:center;color:var(--ord);font-size:28px;flex:none;border:1px solid var(--line)}
.prod .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod .sk{font-size:12px;color:var(--mu)}
.prod .info{flex:1;min-width:0}
.qty{text-align:right;flex:none}
.qty b{display:block;font-size:26px;line-height:1;color:var(--or)}
.qty.low b{color:var(--red)}
.qty small{color:var(--mu);font-size:11px}

/* move buttons */
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.big{border-radius:24px;padding:26px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:20px;font-weight:800;min-height:170px;justify-content:center}
.big .ic{font-size:54px}
.big.in{background:linear-gradient(145deg,var(--or),#ffb347);color:#1a0d00;box-shadow:0 10px 30px #ff7a0050}
.big.out{background:linear-gradient(145deg,#000,#26262b);color:var(--or);border:2px solid var(--or)}
.big small{font-weight:500;font-size:13px;opacity:.8}
.big:active{transform:scale(.97)}

/* stepper */
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:15px;font-size:26px;display:grid;place-items:center;background:var(--bg2);border:1.5px solid var(--line);flex:none}
.stepper button.p{background:linear-gradient(135deg,var(--or),var(--or2));color:#1a0d00;border:0}
.stepper button:active{transform:scale(.92)}
.stepper input{text-align:center;font-size:24px;font-weight:800;padding:10px 4px;width:90px;flex:none;color:var(--or)}
.stepper.sm button{width:42px;height:42px;font-size:20px;border-radius:12px}
.stepper.sm input{width:68px;font-size:19px;padding:7px 2px}

/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-weight:600;font-size:14px;color:var(--mu);display:flex;align-items:center;gap:6px}
.tab.on{background:var(--or);color:#1a0d00;border-color:var(--or)}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.stat:nth-child(odd){background:linear-gradient(145deg,#ff7a00 0%,#ffa040 100%);color:#1a0d00;border:0}
.stat:nth-child(odd) small{color:#3a1d00}
.stat small{display:block;color:var(--mu);font-size:12px}
.stat b{font-size:24px}

/* month + donut */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.monthbar b{font-size:18px}
.donutwrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center}
.donut{width:min(260px,70vw);flex:none}
.donut path,.donut circle.sl{cursor:pointer;transition:opacity .15s}
.donut path:hover,.donut path.act{opacity:.8}
.legend{flex:1;min-width:210px}
.lg{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;cursor:pointer}
.lg:hover{background:#ffffff0a}
.lg i{width:14px;height:14px;border-radius:5px;flex:none}
.lg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg b{font-variant-numeric:tabular-nums}

/* list rows */
.li{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.mi.in{background:#37d67a22;color:var(--grn)}.mi.out{background:#ff525222;color:var(--red)}.mi.adj{background:#ff7a0022;color:var(--or)}
.li .t{flex:1;min-width:0}
.li .t div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t div:last-child{font-size:12px;color:var(--mu)}
.li .d{font-weight:800;font-size:18px;text-align:right}
.pos{color:var(--grn)}.neg{color:var(--red)}

/* modal */
.ov{position:fixed;inset:0;z-index:100;background:#000b;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
@media(min-width:700px){.ov{align-items:center}}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:26px 26px 0 0;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));animation:su .2s}
@media(min-width:700px){.modal{border-radius:26px}}
.modal h3{margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:8px}
.modal h3 .ic{color:var(--or)}
.modal .close{margin-left:auto}
@keyframes fi{from{opacity:0}}
@keyframes su{from{transform:translateY(40px);opacity:0}}
.pick{max-height:260px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:14px}
.pick .prod{border:0;border-radius:0;border-bottom:1px solid var(--line);background:transparent}
.sel{border:2px solid var(--or);border-radius:16px;padding:10px;margin-top:10px;background:var(--card)}
.imgup{display:flex;gap:12px;align-items:center}
.imgup .thumb{width:80px;height:80px}

/* toast */
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
@media(min-width:900px){#toast{bottom:30px}}
.tt{background:#000;border:1.5px solid var(--or);color:var(--tx);padding:11px 18px;border-radius:99px;font-weight:600;box-shadow:0 8px 28px #000a;animation:su .2s;display:flex;gap:8px;align-items:center}
.tt.err{border-color:var(--red)}

/* scanner */
.scanov{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.scanbox{position:relative;width:min(92vw,420px);aspect-ratio:1;border-radius:24px;overflow:hidden;border:3px solid var(--or);background:#111;box-shadow:0 0 40px #ff7a0066}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanline{position:absolute;left:6%;right:6%;height:3px;background:var(--or);box-shadow:0 0 14px var(--or);animation:sc 2s ease-in-out infinite alternate}
@keyframes sc{from{top:10%}to{top:88%}}
.scanman{display:flex;gap:8px;width:min(92vw,420px)}

.fab{position:fixed;right:18px;bottom:92px;z-index:25;width:62px;height:62px;border-radius:20px;font-size:30px;display:grid;place-items:center;background:linear-gradient(135deg,var(--or),var(--or2));color:#1a0d00;box-shadow:0 10px 28px #ff7a0066}
@media(min-width:900px){.fab{bottom:28px;right:32px}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mu);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
.hint{font-size:12px;color:var(--mu);margin-top:6px}
#gate{position:fixed;inset:0;z-index:150;background:radial-gradient(circle at 50% 0%,#3a1a00,#0e0e0f 62%);display:grid;place-items:center;padding:20px;overflow:auto}
.gbox{width:100%;max-width:380px}
#sync{margin-left:4px;white-space:nowrap}
.sw{width:52px;height:30px;border-radius:99px;background:#3a3a40;position:relative;flex:none;transition:.15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--or)}.sw.on::after{left:25px}
.bulkbar{position:sticky;bottom:80px;z-index:5;margin-top:12px}
@media(min-width:900px){.bulkbar{bottom:16px}}
.bli{flex-wrap:wrap}.bli .t{flex:1 1 150px}
.bli.hl{background:#ff7a0018;border-radius:12px}
.sug{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.sug:hover{background:#ffffff0a}
.dqn{min-width:54px;text-align:center;font-size:22px;color:var(--or);font-variant-numeric:tabular-nums}
.dprice{color:var(--or2);font-weight:700;padding:0;text-decoration:underline dotted;font-size:12px}
.prod.flash{box-shadow:0 0 0 2px var(--or)}
.dsec{display:flex;align-items:center;gap:7px;width:100%;padding:11px 14px;margin:4px 0 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:14px;font-weight:700;text-align:left;flex-wrap:wrap}
.dsec .sp{flex:1}.dsec .chev{display:inline-flex;color:var(--or);transition:transform .15s}
.dsec.off .chev{transform:rotate(-90deg)}.dsec.off{border-color:#ff7a0055}
nav button span{white-space:nowrap}
@media(max-width:420px){nav button{font-size:11px;letter-spacing:-.2px}}
#ddate{width:auto;padding:5px 10px;margin-top:4px;font-size:13px;color-scheme:dark}
</style>
</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <main>
    <header class="top">
      <div class="logo" id="hlogo"></div>
      <div class="brand">StockPro<small id="shop"></small></div>
      <span id="sync" class="badge gry"></span>
      <div class="sp"></div>
      <button class="iconbtn" onclick="openSettings()" aria-label="ตั้งค่า" id="gearbtn"></button>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="toast"></div>

<script>
/* ============ ไอคอน ============ */
const IC={
box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
swap:'<path d="M7 4v14M3 14l4 4 4-4M17 20V6M13 10l4-4 4 4"/>',
check:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',
pie:'<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',
scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',
edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
down:'<path d="M12 3v14M5 12l7 7 7-7"/>',up:'<path d="M12 21V7M5 12l7-7 7 7"/>',
x:'<path d="M18 6L6 18M6 6l12 12"/>',
alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
dl:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',ul:'<path d="M12 15V3M7 8l5-5 5 5M5 21h14"/>',
cam:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
l:'<path d="M15 18l-6-6 6-6"/>',chev:'<path d="M6 9l6 6 6-6"/>',r:'<path d="M9 18l6-6-6-6"/>',
fire:'<path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-7 1 1 2 2 3 2 0-3-1-5 0-7z"/>',
coin:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9a2.5 2 0 0 0-2.5-1.5c-1.5 0-2.5.8-2.5 1.8s1 1.5 2.5 1.7 2.5.7 2.5 1.8-1 1.7-2.5 1.7A2.5 2 0 0 1 9.5 15M12 6v1.5M12 16.5V18"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
back:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>'
};
const ic=(n,s)=>`<svg class="ic" viewBox="0 0 24 24"${s?` style="font-size:${s}px"`:''}>${IC[n]}</svg>`;

/* ============ ข้อมูล ============ */
const KEY='stockpro_v1';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.products))return Object.assign({movements:[],counts:[],draft:null,settings:{shopName:'ร้านของฉัน',user:'ฉัน'}},d)}catch(e){}
  return {products:[],movements:[],counts:[],draft:null,settings:{shopName:'ร้านของฉัน',user:'ฉัน'}}}
/* S = ข้อมูลที่ซิงก์จาก Firebase (อัปเดตจาก onSnapshot) / ข้อมูลเฉพาะเครื่อง (ใบนับที่ยังไม่เสร็จ, ชื่อผู้ใช้) เก็บใน LocalStorage */
const LKEY='stockpro_local';
let L={};try{L=JSON.parse(localStorage.getItem(LKEY))||{}}catch(e){}
let S={products:[],movements:[],counts:[],draft:L.draft||null,bulk:L.bulk||null,role:'viewer',members:{},people:{},lockEdits:false,settings:{shopName:'ร้านของฉัน',user:L.user||'ฉัน'}};

/* เปลี่ยนจำนวนสต๊อกทุกครั้งต้องผ่านที่นี่ เพื่อบันทึกประวัติ */
function applyMovement(pid,type,delta,reason,ts,wb){
  const p=P(pid);if(!p||!delta)return;
  const own=!wb;wb=wb||mkBatch();
  p.qty=Math.round((p.qty+delta)*1000)/1000;
  const mid=uid('m'),m={ts:ts||Date.now(),productId:pid,type,qty:delta,after:p.qty,reason:reason||'',user:S.settings.user||''};
  S.movements.push(Object.assign({id:mid},m));
  wb.set(MR(mid),m);                              // บันทึกประวัติ
  wb.update(PR(pid),{qty:FS.increment(delta)});   // increment: หลายเครื่องแก้พร้อมกัน/ออฟไลน์ ยอดจะบวกรวมถูกต้อง
  if(own)wb.commit().catch(wErr);
}

/* ============ UI ช่วยเหลือ ============ */
function toast(msg,kind){const t=document.createElement('div');t.className='tt'+(kind==='err'?' err':'');t.innerHTML=(kind==='err'?ic('alert'):ic('check'))+esc(msg);$('#toast').append(t);setTimeout(()=>t.remove(),2600)}
let modals=[];
function modal(html,onclose){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="modal">${html}</div>`;
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal(ov)});
  document.body.append(ov);modals.push({ov,onclose});return ov;
}
function closeModal(ov){const i=modals.findIndex(m=>m.ov===(ov||modals[modals.length-1]?.ov));if(i<0)return;const m=modals.splice(i,1)[0];m.ov.remove();m.onclose&&m.onclose()}
const closeBtn=`<button class="iconbtn close" onclick="closeModal()" style="width:36px;height:36px">${ic('x')}</button>`;
function confirmBox(msg,yes,label){
  const ov=modal(`<h3>${ic('alert')}ยืนยัน</h3><p>${msg}</p><div class="grid2"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn red" id="cfy">${label||'ยืนยัน'}</button></div>`);
  ov.querySelector('#cfy').onclick=()=>{closeModal(ov);yes()};
}

/* ============ สแกนบาร์โค้ด ============ */
let scanStop=null;
async function scan(cb,opt){
  opt=opt||{};
  const ov=document.createElement('div');ov.className='scanov';
  ov.innerHTML=`<div class="scanbox"><video id="sv" playsinline muted></video><div id="rd" style="width:100%;height:100%;display:none"></div><div class="scanline"></div></div>
  <div class="muted">เล็งบาร์โค้ด / QR ให้อยู่ในกรอบ</div>
  <div class="scanman"><input id="sm" placeholder="หรือพิมพ์/ยิงรหัสที่นี่"><button class="btn" id="smb">ตกลง</button></div>
  <button class="btn ghost" id="scl">${ic('x')}ปิดกล้อง</button>`;
  document.body.append(ov);
  let stream=null,timer=null,h5=null,done=false;
  const stop=()=>{done=true;clearInterval(timer);stream&&stream.getTracks().forEach(t=>t.stop());h5&&h5.stop().catch(()=>{});ov.remove();scanStop=null};
  scanStop=stop;
  let last='',lt=0;
  const found=c=>{if(done||!c)return;c=String(c).trim();
    if(opt.multi){const n=Date.now();if(c===last&&n-lt<1500)return;last=c;lt=n;cb(c);const m=ov.querySelector('.muted');if(m)m.textContent='✔ '+c+' — สแกนชิ้นต่อไปได้เลย';ov.querySelector('#sm').value='';return}  // โหมดสแกนต่อเนื่อง: ไม่ปิดกล้อง
    stop();if(navigator.vibrate)navigator.vibrate(60);cb(c)};
  ov.querySelector('#scl').onclick=stop;
  ov.querySelector('#smb').onclick=()=>found(ov.querySelector('#sm').value);
  ov.querySelector('#sm').addEventListener('keydown',e=>{if(e.key==='Enter')found(e.target.value)});
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('nocam');
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector();
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
      const v=ov.querySelector('#sv');v.srcObject=stream;await v.play();
      timer=setInterval(async()=>{try{const r=await det.detect(v);if(r.length)found(r[0].rawValue)}catch(e){}},300);
    }else{
      await new Promise((res,rej)=>{if(window.Html5Qrcode)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';s.onload=res;s.onerror=rej;document.head.append(s)});
      ov.querySelector('#sv').style.display='none';const rd=ov.querySelector('#rd');rd.style.display='block';
      h5=new Html5Qrcode('rd');
      await h5.start({facingMode:'environment'},{fps:10,qrbox:220},t=>found(t),()=>{});
    }
  }catch(e){toast('เปิดกล้องไม่ได้ — พิมพ์รหัสหรือใช้เครื่องสแกนแทนได้','err');ov.querySelector('#sm').focus()}
}

const matchP=(p,q)=>{q=(q||'').trim().toLowerCase();return !q||[p.name,p.sku,p.barcode,p.cat].some(x=>(x||'').toLowerCase().includes(q))};

function resizeImg(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=260,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(file)})}

const REASONS={in:[['ซื้อ/รับสินค้าเข้า','in'],['ลูกค้าตีกลับ','return'],['อื่นๆ','in']],out:[['ขายออก','out'],['เสียหาย/ชำรุด','damage'],['หาย/เบิกใช้/อื่นๆ','out']]};
function moveDlg(mode){
  if(!canEdit())return needEdit();
  let pid=null,q=1,ri=0,search='';
  const ov=modal('');const box=ov.querySelector('.modal');
  const draw=()=>{
    const p=pid&&P(pid);
    box.innerHTML=`<h3>${ic(mode==='in'?'down':'up')}${mode==='in'?'รับสินค้าเข้า':'ตัดสินค้าออก'}${closeBtn}</h3>
    ${p?`<div class="sel"><div class="row">${thumb(p)}<div style="flex:1;min-width:0"><div style="font-weight:700">${esc(p.name)}</div><div class="muted" style="font-size:13px">คงเหลือ ${p.qty} · ${esc(p.sku)}</div></div><button class="btn ghost sm" id="chg">เปลี่ยน</button></div>
      <label>จำนวน</label><div class="stepper" style="justify-content:center"><button id="mm">${ic('minus')}</button><input id="mq" type="number" inputmode="numeric" value="${q}"><button class="p" id="mp">${ic('plus')}</button></div>
      <label>เหตุผล</label><select id="mr">${REASONS[mode].map((r,i)=>`<option value="${i}" ${i===ri?'selected':''}>${r[0]}</option>`).join('')}</select>
      <div class="hint">หลังบันทึก: คงเหลือ <b style="color:var(--or)">${p.qty+(mode==='in'?1:-1)*q}</b></div></div>
      <button class="btn block" id="ok" style="margin-top:16px;padding:16px">${ic('check')}ยืนยัน${mode==='in'?'รับเข้า':'ตัดออก'}</button>`
    :`<div class="searchbar" style="margin-top:12px">${ic('search')}<input id="ms" placeholder="ค้นหาสินค้า…" value="${esc(search)}"><button class="btn" id="msc">${ic('scan',22)}</button></div>
      <div class="pick" id="mpk"></div>`}
    `;
    if(p){
      box.querySelector('#chg').onclick=()=>{pid=null;draw()};
      const mq=box.querySelector('#mq');
      const upd=v=>{q=Math.max(1,Math.floor(num(v))||1);mq.value=q;box.querySelector('.hint b').textContent=p.qty+(mode==='in'?1:-1)*q};
      box.querySelector('#mm').onclick=()=>upd(q-1);box.querySelector('#mp').onclick=()=>upd(q+1);mq.onchange=()=>upd(mq.value);
      box.querySelector('#mr').onchange=e=>ri=+e.target.value;
      box.querySelector('#ok').onclick=()=>{
        upd(mq.value);
        if(mode==='out'&&q>p.qty)return confirmBox(`ตัดออก ${q} แต่คงเหลือเพียง ${p.qty} (จะติดลบ) ต้องการทำต่อหรือไม่?`,go2,'ทำต่อ');
        go2();
        function go2(){const r=REASONS[mode][ri];applyMovement(pid,r[1],(mode==='in'?1:-1)*q,r[0]);closeModal(ov);toast(`${mode==='in'?'รับเข้า':'ตัดออก'} ${q} ชิ้น แล้ว`);render()}
      };
    }else{
      const fill=()=>{const l=S.products.filter(x=>matchP(x,search)).slice(0,40);

const fine=matchMedia('(pointer:fine)').matches;   // มีเมาส์/คีย์บอร์ด → โฟกัสช่องสแกนอัตโนมัติ (มือถือจะไม่เด้งคีย์บอร์ด)
let actx=null;
function beep(ok){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();
  o.type=ok?'sine':'square';o.frequency.value=ok?1250:220;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+(ok?.08:.3))}catch(e){}
  if(navigator.vibrate)navigator.vibrate(ok?40:[80,60,80])}
function bulkStart(mode){if(!canEdit())return needEdit();S.bulk={mode,items:[],ri:0,step:1};save();render()}
function bulkCancel(){const done=()=>{S.bulk=null;save();render()};if(!S.bulk.items.length)return done();confirmBox(`ยกเลิกรายการที่สแกนไว้ ${S.bulk.items.length} รายการ?`,done,'ยกเลิกทั้งหมด')}
function bulkAdd(pid,n){const b=S.bulk;let it=b.items.find(i=>i.id===pid);
  if(it){it.q+=n;b.items=[it].concat(b.items.filter(i=>i!==it))}else b.items.unshift({id:pid,q:n});   // รายการล่าสุดขึ้นบนสุด
  save();bulkList(pid)}
function bulkScan(code){code=(code||'').trim();if(!code||!S.bulk)return false;const p=findByCode(code);
  if(p){bulkAdd(p.id,S.bulk.step||1);beep(true);return true}
  beep(false);toast('ไม่พบรหัส '+code,'err');return false}
const bqFocus=()=>{if(fine){const q=$('#bq');if(q)q.focus()}};
function vBulk(){
  const b=S.bulk,inn=b.mode==='in';
  $('#view').innerHTML=`<h2>${ic(inn?'down':'up',26)}${inn?'รับเข้า':'ตัดออก'}หลายรายการ<span class="sp"></span><button class="btn ghost sm" onclick="bulkCancel()">${ic('x',16)}ยกเลิก</button></h2>
  <div class="card" style="border-color:var(--or)">
    <div class="searchbar" style="margin:0">${ic('scan')}<input id="bq" placeholder="ยิงบาร์โค้ด / พิมพ์ SKU หรือชื่อ แล้วกด Enter" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"><button class="btn" id="bcam" aria-label="สแกนด้วยกล้อง">${ic('cam',22)}</button></div>
    <div id="bsug"></div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap"><span class="muted" style="font-size:13px">จำนวนต่อการสแกน</span>
      <div class="stepper sm"><button id="bsm">${ic('minus')}</button><input id="bst" type="number" inputmode="numeric" value="${b.step}"><button class="p" id="bsp">${ic('plus')}</button></div>
      <select id="br" style="flex:1;min-width:150px">${REASONS[b.mode].map((r,i)=>`<option value="${i}" ${i===b.ri?'selected':''}>${r[0]}</option>`).join('')}</select></div>
    <div class="hint">เครื่องสแกน USB/Bluetooth ยิงได้ทันทีแม้ไม่ได้คลิกช่อง · สแกนซ้ำ = เพิ่มจำนวน · กล้องจะเปิดค้างให้สแกนต่อเนื่อง</div>
  </div>
  <div id="bl" style="margin-top:12px"></div>
  <div class="bulkbar"><button class="btn block" id="bok" style="padding:16px"></button></div>`;
  const q=$('#bq'),sug=$('#bsug');
  const pick=id=>{bulkAdd(id,S.bulk.step||1);beep(true);q.value='';sug.innerHTML='';bqFocus()};
  const showSug=()=>{const v=q.value.trim();if(v.length<2){sug.innerHTML='';return[]}
    const l=S.products.filter(p=>matchP(p,v)).slice(0,6);
    sug.innerHTML=l.map(p=>`<div class="sug" data-id="${p.id}"><div class="thumb" style="width:36px;height:36px;font-size:16px;border-radius:10px;${p.img?`background-image:url(${p.img})`:''}">${p.img?'':ic('box')}</div><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(p.name)}</div><div class="muted" style="font-size:12px">${esc(p.sku||'')} · คงเหลือ ${p.qty}</div></div>${ic('plus')}</div>`).join('');
    sug.querySelectorAll('.sug').forEach(e=>e.onclick=()=>pick(e.dataset.id));return l};
  q.oninput=showSug;
  q.onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();const v=q.value.trim();if(!v)return;
    if(findByCode(v)){bulkScan(v);q.value='';sug.innerHTML='';return}
    const l=showSug();if(l.length===1)pick(l[0].id);else if(!l.length){bulkScan(v);q.value=''}};   // ชื่อซ้ำหลายตัว → ให้เลือกจากรายการ
  $('#bcam').onclick=()=>scan(c=>bulkScan(c),{multi:true});
  const st=$('#bst'),setStep=v=>{S.bulk.step=Math.max(1,Math.floor(num(v))||1);st.value=S.bulk.step;save()};
  $('#bsm').onclick=()=>{setStep(S.bulk.step-1);bqFocus()};$('#bsp').onclick=()=>{setStep(S.bulk.step+1);bqFocus()};st.onchange=()=>setStep(st.value);
  $('#br').onchange=e=>{S.bulk.ri=+e.target.value;save()};
  $('#bok').onclick=bulkCommit;
  bulkList();bqFocus();
}
function bulkList(hl){
  const b=S.bulk,el=$('#bl');if(!b||!el)return;const inn=b.mode==='in';
  b.items=b.items.filter(i=>P(i.id));   // ตัดสินค้าที่ถูกลบไปแล้ว
  const tot=b.items.reduce((s,i)=>s+i.q,0);
  el.innerHTML=b.items.length?`<div class="row muted" style="font-size:13px;margin:0 4px 6px"><span>${b.items.length} รายการ · ${money(tot)} ชิ้น</span></div><div class="card" style="padding:4px 10px">`+b.items.map(it=>{const p=P(it.id),after=p.qty+(inn?1:-1)*it.q,bad=after<0;

      <div class="stepper sm" style="margin-left:auto"><button data-m="${it.id}">${ic('minus')}</button><input type="number" inputmode="numeric" data-q="${it.id}" value="${it.q}"><button class="p" data-p="${it.id}">${ic('plus')}</button></div>
      <button class="iconbtn" data-x="${it.id}" aria-label="เอาออก" style="width:36px;height:36px">${ic('x')}</button></div>`}).join('')+`</div>`
    :`<div class="empty">${ic('scan')}<div style="font-weight:700;color:var(--tx)">เริ่มสแกนสินค้าได้เลย</div><div style="font-size:13px">ยิงเครื่องสแกน, กดปุ่มกล้อง หรือพิมพ์ชื่อสินค้า</div></div>`;
  const it=id=>S.bulk.items.find(i=>i.id===id),upd=()=>{save();bulkList();bqFocus()};
  el.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{const i=it(x.dataset.m);i.q=Math.max(1,i.q-1);upd()});
  el.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{it(x.dataset.p).q++;upd()});
  el.querySelectorAll('[data-q]').forEach(x=>x.onchange=()=>{it(x.dataset.q).q=Math.max(1,Math.floor(num(x.value))||1);upd()});
  el.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>{S.bulk.items=S.bulk.items.filter(i=>i.id!==x.dataset.x);upd()});
  const ok=$('#bok');if(ok){ok.disabled=!b.items.length;ok.style.opacity=b.items.length?1:.45;ok.innerHTML=`${ic('check')}ยืนยัน${inn?'รับเข้า':'ตัดออก'} ${b.items.length} รายการ · ${money(tot)} ชิ้น`}
}
function bulkCommit(){
  const b=S.bulk;if(!b||!b.items.length)return;if(!canEdit())return needEdit();
  const inn=b.mode==='in',items=b.items.filter(i=>P(i.id)&&i.q>0),tot=items.reduce((s,i)=>s+i.q,0),neg=inn?[]:items.filter(i=>P(i.id).qty-i.q<0);
  confirmBox(`${inn?'รับเข้า':'ตัดออก'} <b>${items.length}</b> รายการ รวม <b>${money(tot)}</b> ชิ้น<br><span class="muted">เหตุผล: ${esc(REASONS[b.mode][b.ri][0])}</span>${neg.length?`<br><span style="color:var(--red)">⚠ ${neg.length} รายการจะทำให้สต๊อกติดลบ</span>`:''}`,()=>{
    const r=REASONS[b.mode][b.ri]||REASONS[b.mode][0],wb=mkBatch(),ts=Date.now();
    items.forEach(i=>applyMovement(i.id,r[1],(inn?1:-1)*i.q,r[0]+' (หลายรายการ)',ts,wb));   // ส่งเป็นชุดเดียว (แบ่งอัตโนมัติถ้าเกิน 450)
    wb.commit().catch(wErr);S.bulk=null;save();toast(`${inn?'รับเข้า':'ตัดออก'} ${items.length} รายการ (${money(tot)} ชิ้น) แล้ว`);render()},'ยืนยันบันทึก');
}
/* เครื่องสแกนบาร์โค้ดทำงานเหมือนคีย์บอร์ดที่พิมพ์เร็วมากแล้วกด Enter → จับไว้ได้แม้ไม่ได้โฟกัสช่องสแกน */
let kbuf='',kt=0;
document.addEventListener('keydown',e=>{
  const h=tab==='daily'?dScan:(S.bulk&&tab==='move'?bulkScan:null);
  if(!h||modals.length||scanStop)return;
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  const now=Date.now();if(now-kt>80)kbuf='';kt=now;

});

const wErr=e=>{console.warn(e);toast(e&&e.code==='permission-denied'?'ไม่มีสิทธิ์ทำรายการนี้':'บันทึกไม่สำเร็จ: '+((e&&e.message)||e),'err')};
/* batch ที่แบ่งส่งอัตโนมัติทุก 450 รายการ (ขีดจำกัด Firestore คือ 500) */
function mkBatch(){let b=FS.writeBatch(db),n=0;const ps=[];
  const flush=()=>{ps.push(b.commit());b=FS.writeBatch(db);n=0};
  const bump=()=>{if(++n>=450)flush()};
  return {set(r,d,o){o?b.set(r,d,o):b.set(r,d);bump()},update(r,d){b.update(r,d);bump()},commit(){if(n)flush();return Promise.all(ps)}}}
async function importData(d){
  if(!canEdit())return needEdit();const wb=mkBatch(),mid=new Set(S.movements.map(m=>m.id)),cid=new Set(S.counts.map(c=>c.id));
  (d.products||[]).forEach(p=>p.id&&wb.set(PR(p.id),strip(p)));
  (d.movements||[]).forEach(m=>{if(m.id&&!mid.has(m.id))wb.set(MR(m.id),strip(m))});
  (d.counts||[]).forEach(c=>{if(c.id&&!cid.has(c.id))wb.set(CR(c.id),strip(c))});
  await wb.commit()}

  mRedraw=draw;draw();
}
function setSync(){const e=$('#sync');if(!e)return;const off=!navigator.onLine,p=pend.p||pend.m||pend.c;
  e.className='badge '+(off?'red':p?'':'grn');e.textContent=off?(p?'ออฟไลน์ · รอซิงก์':'ออฟไลน์'):p?'กำลังซิงก์…':'ซิงก์แล้ว'}
addEventListener('online',setSync);addEventListener('offline',setSync);
function changed(){setSync();clearTimeout(tmr);tmr=setTimeout(()=>{
  if(!ready){if(first.p&&first.m&&first.c){ready=true;gateOff();render();offerMigrate()}}else refresh();if(mRedraw)mRedraw()},50)}
function stopListeners(){unsubs.forEach(u=>u());unsubs=[];if(dUnsub){dUnsub();dUnsub=null;dMonth=null}first={};pend={};ready=false}
function startListeners(){
  stopListeners();
  const on=(q,k,cb)=>unsubs.push(FS.onSnapshot(q,{includeMetadataChanges:true},sn=>{pend[k]=sn.metadata.hasPendingWrites;first[k]=1;cb(sn);changed()},
    e=>{console.warn(e);if(e.code==='permission-denied'){ready=false;gate('<p class="muted" style="text-align:center;margin:14px 0">คุณไม่มีสิทธิ์เข้าถึงร้านนี้ (อาจถูกเจ้าของร้านลบออก)</p><button class="btn block" id="sw1">เข้าร่วมร้านอื่น / สร้างร้านใหม่</button><button class="btn ghost block" id="so" style="margin-top:8px">ออกจากระบบ</button>');$('#so').onclick=()=>FA.signOut(auth);$('#sw1').onclick=()=>{stopListeners();shopId=null;L.shopId=null;save();showShop()}}}));
  const col=n=>FS.collection(db,'shops',shopId,n);
  on(FS.doc(db,'shops',shopId),'s',sn=>{if(!sn.exists())return;const d=sn.data();S.settings.shopName=d.name||'ร้านของฉัน';S.members=d.members||{};S.role=S.members[user.uid]||'viewer';S.lockEdits=!!d.lockEdits;S.dailyCut=d.dailyCut!==false;first.s=1});
  on(col('people'),'g',sn=>{S.people={};sn.docs.forEach(d=>{S.people[d.id]=d.data()})});
  on(col('products'),'p',sn=>{S.products=sn.docs.map(d=>Object.assign({id:d.id},d.data()))});
  on(FS.query(col('movements'),FS.orderBy('ts','desc'),FS.limit(2000)),'m',sn=>{S.movements=sn.docs.map(d=>Object.assign({id:d.id},d.data()))});
  on(FS.query(col('counts'),FS.orderBy('countedAt','desc'),FS.limit(200)),'c',sn=>{S.counts=sn.docs.map(d=>Object.assign({id:d.id},d.data()))});
}
function enterShop(id){shopId=id;L.shopId=id;L.uid=user.uid;if(S.settings.user==='ฉัน'&&user.displayName)S.settings.user=user.displayName;save();
  gate('<p class="muted" style="text-align:center;margin-top:14px">กำลังโหลดข้อมูลร้าน…</p>');
  FS.setDoc(FS.doc(db,'shops',id,'people',user.uid),{name:S.settings.user||user.displayName||'',email:user.email||''},{merge:true}).catch(()=>{});
  startListeners()}
function offerMigrate(){if(S.products.length||L.migrated)return;const o=load();if(!o.products.length)return;L.migrated=1;save();
  confirmBox(`พบข้อมูลเดิมในเครื่องนี้ (${o.products.length} สินค้า) ย้ายขึ้นระบบกลางเลยไหม?`,()=>importData(o).then(()=>toast('ย้ายข้อมูลแล้ว')).catch(wErr),'ย้ายข้อมูล')}
async function boot(){
  gate('<p class="muted" style="text-align:center;margin-top:14px">กำลังเริ่มต้น…</p>');
  try{
    const B='https://www.gstatic.com/firebasejs/10.12.2/';
    const [A,Au,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=A.initializeApp(FBC);FA=Au;FS=F;auth=Au.getAuth(app);
    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
  }catch(e){console.warn(e);gate('<p class="muted" style="text-align:center;margin:14px 0">โหลดระบบซิงก์ไม่ได้ — ต้องออนไลน์ในการเปิดครั้งแรก</p><button class="btn block" onclick="location.reload()">ลองใหม่</button>');return}
  FA.onAuthStateChanged(auth,async u=>{
    user=u;
    if(!u){stopListeners();shopId=null;L.shopId=null;S.products=[];S.movements=[];S.counts=[];save();return showLogin()}
    if(L.shopId&&L.uid===u.uid)return enterShop(L.shopId);
    gate('<p class="muted" style="text-align:center;margin-top:14px">กำลังตรวจสอบบัญชี…</p>');
    try{const s=await FS.getDoc(FS.doc(db,'users',u.uid));s.exists()?enterShop(s.data().shopId):showShop()}
    catch(e){showLogin('โหลดข้อมูลบัญชีไม่ได้: '+(e.code||e.message))}
  });
}

/* ============ เริ่มต้น ============ */
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(scanStop)scanStop();else closeModal()}});
boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
